<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Update Teacher Password</title>

    <!-- + Add: Link the page stylesheet -->
    <link rel="stylesheet" href="update-tpassword.css">
</head>

<body>

    <!-- + Add: Main page container -->
    <main class="page-container">

        <!-- + Add: Password update card -->
        <section class="password-card">

            <!-- + Add: Page icon -->
            <div class="page-icon">
                🔐
            </div>

            <!-- + Add: Page heading -->
            <h1>Update Password</h1>

            <!-- + Add: Page description -->
            <p class="description">
                Update the teacher's account password securely.
            </p>


            <!-- + Add: Password update form -->
            <form
                action="/update-tpassword"
                method="POST"
                enctype="application/x-www-form-urlencoded"
            >

                <!-- + Add: Email field -->
                <div class="form-group">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter teacher email"
                        required
                    >
                </div>


                <!-- + Add: New password field -->
                <div class="form-group">
                    <label for="password">
                        New Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter new password"
                        required
                    >
                </div>


                <!-- + Add: Submit button -->
                <button type="submit">
                    Update Password
                </button>

            </form>

        </section>

    </main>

</body>

</html>
