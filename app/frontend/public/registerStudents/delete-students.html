<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delete Student</title>

<link rel="stylesheet" href="delete-students.css">

</head>

<body>

<main class="page-container">

    
    <section class="students-section">

        <h2>Registered Students</h2>

        <p class="iframe-description">
            Use the student IDs below to identify the student you want to delete.
        </p>

        <iframe
            src="/viewStudents/view-students.html"
            title="Registered Students"
            class="students-frame"
        ></iframe>

    </section>

    <section class="delete-section">

        <header class="page-header">
            <p class="eyebrow">Student Management</p>

            <h1>Delete Student</h1>

            <p class="subtitle">
                Enter the ID of the student you want to delete.
            </p>
        </header>


        <form
            action="/delete-student"
            method="post"
            onsubmit="return confirmDelete()"
            class="delete-form"
        >

            <label for="id">Student ID</label>

            <input
                type="number"
                id="id"
                name="id"
                placeholder="Enter student ID"
                required
            >

            <button type="submit">
                Delete Student
            </button>

        </form>

    </section>


</main>


<script>
    function confirmDelete() {
        return confirm("Are you sure you want to delete this student?");
    }
</script>

</body>

</html>
